services:
  qa-analytics:
    build: .
    # Plausible's documented start sequence: create + migrate the Postgres/ClickHouse
    # schemas before running (the image default command does NOT migrate).
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      # BASE_URL, SECRET_KEY_BASE, TOTP_VAULT_KEY are required by Plausible to boot.
      # Supply real secrets via the Shipyard dashboard (env vars).
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - PORT=8000
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-k6EmluumvcTu//e/Ygtwn+z7j/LfbKw6vdwOz2ifGwpV3mGR/zUglbJ1XAswiQjkyE1IIzH8wx5lYROHcZRkBg==}
      - TOTP_VAULT_KEY=${TOTP_VAULT_KEY:-b2/2eSnQ811GYedrxB1tIsMJupSdUMhWq0LOgA3Unrs=}
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db
    ports:
      - "8001:8000"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    labels:
      shipyard.route: '/'
      shipyard.primary-route: 'true'
      shipyard.env.BASE_URL: '${SHIPYARD_URL}'

  plausible_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plausible_db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - event-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    labels:
      shipyard.deploy.disk.size: 10Gi
  event-data:
    labels:
      shipyard.deploy.disk.size: 10Gi
